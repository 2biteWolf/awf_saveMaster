<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWF_saveMaster</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    html, body { width: 100%; height: 100%; background: #000; overflow: auto; }
    #img { display: block; }
    #toast {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
      background: #222034; color: #99e550; border: 1px solid #99e550;
      font: 16px/1.3 VT323, Consolas, monospace; padding: 8px 14px;
      opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 9;
      white-space: nowrap; max-width: 92vw;
    }
    #toast.show { opacity: 1; }
    #nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 9; pointer-events: auto;
    }
    #nav button {
      background: #222034; color: #99e550; border: 1px solid #99e550;
      font: 14px VT323, monospace; padding: 6px 10px;
    }
    #nav button:hover { background: #2e2c42; }
    #histToggle {
      position: fixed; left: 10px; bottom: 12px; z-index: 12;
      width: 28px; height: 44px;
      background: #222034; color: #99e550; border: 1px solid #99e550;
      font: 18px VT323, monospace; padding: 0; cursor: pointer;
    }
    #histToggle:hover { background: #2e2c42; }
    #histDrawer {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 11;
      width: 128px; background: #0d0b12; border-right: 1px solid #99e550;
      transform: translateX(-100%); transition: transform .18s ease;
      overflow: auto; padding: 8px 8px 56px;
    }
    #histDrawer.open { transform: translateX(0); }
    .hist-item {
      display: block; width: 100%; margin: 0 0 6px; padding: 0;
      background: #222034; border: 1px solid #2e2c42; cursor: pointer;
    }
    .hist-item.current { border-color: #99e550; }
    .hist-item img, .hist-item video {
      display: block; width: 100%; height: 72px; object-fit: cover;
      image-rendering: auto; background: #111;
    }
    #saveAsBtn {
      position: fixed; right: 12px; bottom: 12px; z-index: 12;
      background: #222034; color: #99e550; border: 1px solid #99e550;
      font: 16px VT323, monospace; padding: 8px 12px; cursor: pointer;
    }
    #saveAsBtn:hover { background: #2e2c42; }
    #fmtMenu {
      position: fixed; right: 12px; bottom: 52px; z-index: 13;
      background: #222034; border: 1px solid #99e550; min-width: 128px;
      display: none;
    }
    #fmtMenu.open { display: block; }
    #fmtMenu button {
      display: block; width: 100%; text-align: left;
      background: #222034; color: #99e550; border: 0; border-bottom: 1px solid #2e2c42;
      font: 15px VT323, monospace; padding: 7px 10px; cursor: pointer;
    }
    #fmtMenu button.on { background: #99e550; color: #222034; }
    #fmtMenu button:hover { background: #2e2c42; color: #99e550; }
    #vid { display: none; background: #000; }
  </style>
</head>
<body>
  <div id="toast"></div>
  <img id="img" alt="">
  <video id="vid" controls loop playsinline></video>
  <button type="button" id="saveAsBtn">save as</button>
  <div id="fmtMenu"></div>
  <button type="button" id="histToggle" title="history">›</button>
  <aside id="histDrawer">
    <div id="histList"></div>
  </aside>
  <div id="nav">
    <button type="button" id="prev">← prev</button>
    <button type="button" id="next">next →</button>
    <button type="button" id="savebtn">save</button>
  </div>
  <script src="../settings.js"></script>
  <script src="tabspin.js"></script>
  <script src="tabcycle.js"></script>
  <script src="../content.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
